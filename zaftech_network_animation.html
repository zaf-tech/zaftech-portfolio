
<canvas id="c" style="display:block;width:100%;height:480px;border-radius:12px;background:#0d1117;"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

function resize() {
  canvas.width = canvas.offsetWidth;
  canvas.height = canvas.offsetHeight;
}
resize();
window.addEventListener('resize', resize);

const NODE_COUNT = 55;
const CONNECT_DIST = 130;
const NAVY = '#0d1117';

const nodes = Array.from({length: NODE_COUNT}, () => ({
  x: Math.random() * canvas.width,
  y: Math.random() * canvas.height,
  vx: (Math.random() - 0.5) * 0.5,
  vy: (Math.random() - 0.5) * 0.5,
  r: Math.random() * 2.5 + 1.5,
  pulse: Math.random() * Math.PI * 2,
}));

let mouse = {x: -999, y: -999};
canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  mouse.x = e.clientX - rect.left;
  mouse.y = e.clientY - rect.top;
});
canvas.addEventListener('mouseleave', () => { mouse.x = -999; mouse.y = -999; });

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = NAVY;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  const t = Date.now() * 0.001;

  nodes.forEach(n => {
    n.x += n.vx;
    n.y += n.vy;
    if (n.x < 0 || n.x > canvas.width) n.vx *= -1;
    if (n.y < 0 || n.y > canvas.height) n.vy *= -1;
    n.pulse += 0.02;
  });

  for (let i = 0; i < nodes.length; i++) {
    for (let j = i + 1; j < nodes.length; j++) {
      const a = nodes[i], b = nodes[j];
      const dx = a.x - b.x, dy = a.y - b.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (dist < CONNECT_DIST) {
        const alpha = (1 - dist / CONNECT_DIST) * 0.4;
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.strokeStyle = `rgba(56, 140, 255, ${alpha})`;
        ctx.lineWidth = 0.6;
        ctx.stroke();
      }
    }
  }

  const mouseR = 120;
  nodes.forEach(n => {
    const dx = n.x - mouse.x, dy = n.y - mouse.y;
    const dist = Math.sqrt(dx*dx + dy*dy);
    if (dist < mouseR) {
      const alpha = (1 - dist / mouseR) * 0.7;
      ctx.beginPath();
      ctx.moveTo(n.x, n.y);
      ctx.lineTo(mouse.x, mouse.y);
      ctx.strokeStyle = `rgba(100, 200, 255, ${alpha})`;
      ctx.lineWidth = 0.8;
      ctx.stroke();
    }
  });

  nodes.forEach(n => {
    const glow = 0.6 + 0.4 * Math.sin(n.pulse);
    ctx.beginPath();
    ctx.arc(n.x, n.y, n.r * glow, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(80, 160, 255, ${0.7 * glow})`;
    ctx.fill();

    ctx.beginPath();
    ctx.arc(n.x, n.y, n.r * 2.2 * glow, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(56, 120, 255, ${0.12 * glow})`;
    ctx.fill();
  });

  const dx = canvas.width / 2 - mouse.x;
  const dy = canvas.height / 2 - mouse.y;
  const mdist = Math.sqrt(dx*dx + dy*dy);
  if (mdist < 200) {
    ctx.beginPath();
    ctx.arc(mouse.x, mouse.y, 4, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(160, 220, 255, 0.9)';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(mouse.x, mouse.y, 10, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(100, 180, 255, 0.3)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  ctx.font = '500 13px sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.08)';
  ctx.fillText('ZAFTECH', 24, canvas.height - 18);

  requestAnimationFrame(draw);
}

draw();
</script>
